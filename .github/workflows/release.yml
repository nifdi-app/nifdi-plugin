name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund
      - run: npm run test:structure
      - run: npm run package
      # Preserve the source bundle for clients that copy skills directly.
      - run: git archive --format=zip --prefix=nifdi-plugin/ -o nifdi-plugin.zip HEAD
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/nifdi.zip dist/nifdi-local.zip nifdi-plugin.zip --title "nifdi $GITHUB_REF_NAME" --generate-notes
